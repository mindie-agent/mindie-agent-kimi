name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce Unix LF Line Endings
        run: python .github/scripts/check_lf_eol.py
      - name: Install pinned runtime
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          pip install uv
          uv pip install --system -r runtime-requirements.txt -r runtime/active-overrides.txt -r test-requirements.txt --overrides runtime/active-overrides.txt
      - name: Compile all committed Python
        run: python -m compileall -q scripts tests
      - name: Outside-checkout artifact smoke check
        shell: bash
        run: |
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          cp -R assets scripts kimi.plugin.json harness-compatibility.json product-contract.json "$SMOKE_DIR/"
          (cd "$SMOKE_DIR" && python -c "import sys; sys.path.insert(0, 'scripts'); import entry; entry.verify_bundled_seed()")
      - name: Release metadata contract
        run: python scripts/setup.py release-metadata --source . --tests tests --revision "${{ github.sha }}"
      - name: Install Node for native launch
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native launch
        run: python -m unittest discover -s tests/native -v
      - name: Component tests
        run: python -m pytest -q -o "pythonpath=tests scripts" tests

  host-acceptance:
    uses: mindie-agent/mindie-bench/.github/workflows/verify-host-plugin.yml@main
    with:
      host: kimi

  release-ready:
    name: release-ready
    needs: [component, host-acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
