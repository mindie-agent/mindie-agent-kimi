name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Use the reviewed peer commit; publish dependency branches before CI.
      # The test archives this exact revision and never substitutes main.
      - name: Checkout fixed Claude peer
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/mindie-agent-cc
          ref: 3e36a285e2effe47bc442079a4ed7f42ced9caaf
          path: peer-cc
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned runtime
        run: pip install -r runtime-requirements.txt
      - name: Pin preflight
        env:
          MINDIE_PEER_CC_REPO: ${{ github.workspace }}/peer-cc
        run: python tests/preflight.py
      - name: Installed runtime probe
        run: python -m unittest discover -s tests -p test_runtime_contract.py
      - name: Install Node for native launch
        if: runner.os != 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Native launch
        if: runner.os != 'macOS'
        run: python -m unittest discover -s tests/native -v
      - name: Real transport cancellation and backpressure
        run: python -m unittest discover -s tests -p test_front_control.py -v
      - name: Component tests
        env:
          MINDIE_PEER_CC_REPO: ${{ github.workspace }}/peer-cc
        run: python -m unittest discover -s tests
