name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/mindie-agent-kimi-0.1.33.md
      version-files: |
        kimi.plugin.json
        pyproject.toml
      setup-command: |
        uv sync --frozen --no-editable --no-install-project
      test-command: |
        PYTHONPATH=tests:scripts .venv/bin/python -m pytest -q tests
        .venv/bin/python -m unittest discover -s tests/native
      node: true
      build-command: |
        .venv/bin/python scripts/setup.py release-metadata --source . --tests tests --revision "$GITHUB_SHA" > "$RELEASE_ASSETS_DIR/mindie-plugin-release.json"
        git archive --format=tar.gz --prefix="mindie-agent-kimi-$RELEASE_VERSION/" --output="$RELEASE_ASSETS_DIR/mindie-agent-kimi-$RELEASE_VERSION.tar.gz" "$GITHUB_SHA"
