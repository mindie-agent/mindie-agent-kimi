name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@1be01002cf77a119237469897e088adb17b9ac08
    with:
      version-files: |
        kimi.plugin.json
      setup-command: |
        uv venv --python 3.13 && uv pip install -r runtime-requirements.txt pytest
      test-command: |
        .venv/bin/python tests/preflight.py
        .venv/bin/python -m pytest -q -m "not live_npu"
      node: true
      build-command: |
        git archive --format=tar.gz --prefix="mindie-agent-kimi-$RELEASE_VERSION/" --output="$RELEASE_ASSETS_DIR/mindie-agent-kimi-$RELEASE_VERSION.tar.gz" "$GITHUB_SHA"
