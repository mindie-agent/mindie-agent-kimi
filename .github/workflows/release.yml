name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@484b80621aaf9293c559786d0ef2174c79a0dbb4
    with:
      benchmark-ref: 484b80621aaf9293c559786d0ef2174c79a0dbb4
      release-notes-path: docs/releases/mindie-agent-kimi-0.1.3.md
      version-files: |
        kimi.plugin.json
      setup-command: |
        uv venv --python 3.13 && uv pip install -r runtime-requirements.txt --overrides runtime-requirements.txt pytest
      test-command: |
        .venv/bin/python tests/preflight.py
        PYTHONPATH=tests:scripts .venv/bin/python -m pytest -q tests
        .venv/bin/python -m unittest discover -s tests/native
      node: true
      build-command: |
        .venv/bin/python scripts/release_metadata.py build --source . --revision "$GITHUB_SHA" > "$RELEASE_ASSETS_DIR/mindie-plugin-release.json"
        git archive --format=tar.gz --prefix="mindie-agent-kimi-$RELEASE_VERSION/" --output="$RELEASE_ASSETS_DIR/mindie-agent-kimi-$RELEASE_VERSION.tar.gz" "$GITHUB_SHA"
